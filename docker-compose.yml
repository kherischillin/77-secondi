# Avvia il gioco completo (sito + database) con:  docker compose up --build
# Poi apri http://localhost:3001
#
# Il nome del progetto tiene separati dati e immagini da quelli dello scheletro (gdr-online),
# e la porta 3001 permette di avviare le due versioni insieme.
name: 77-secondi

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gdr
      # Password del database: di base "gdr". Per cambiarla (da fare prima di mettere il gioco online)
      # vedi docs/guida-staff.md → "Mettere il gioco online": si scrive in un file .env, non qui.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gdr}
      POSTGRES_DB: gdr
    volumes:
      - dati-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gdr -d gdr']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gdr:${DB_PASSWORD:-gdr}@db:5432/gdr
      ORIGIN: http://localhost:3001
      PORT: 3000
      UPLOAD_DIR: /app/uploads
      # Dimensione massima di un invio (le immagini possono arrivare a 5 MB).
      BODY_SIZE_LIMIT: 64M
      # SOLO quando il gioco è online dietro un server web (Caddy, Nginx...): togli il "#" dalle due
      # righe qui sotto. Servono a riconoscere il vero indirizzo di ogni giocatore; senza, tutti
      # sembrano la stessa persona e i limiti sui tentativi di accesso bloccano tutti insieme.
      # Sul tuo PC lasciale spente. Vedi docs/guida-staff.md → "Mettere il gioco online".
      # ADDRESS_HEADER: X-Forwarded-For
      # XFF_DEPTH: 1
    volumes:
      - immagini:/app/uploads
    ports:
      - '3001:3000'

volumes:
  # I dati del gioco restano qui anche se spegni o ricostruisci i container.
  dati-db:
  # Le immagini caricate dal pannello (mappe, luoghi).
  immagini:
