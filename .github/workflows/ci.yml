# Controlli automatici a ogni modifica: tipi, test e costruzione del sito.
# Il risultato si vede nella scheda "Actions" del repository su GitHub (spunta verde = tutto a posto).
name: Controlli

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controlli:
    runs-on: ubuntu-latest
    # Database usa e getta per i test che ne hanno bisogno (denaro, mercato, account, permessi).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gdr
          POSTGRES_PASSWORD: gdr
          POSTGRES_DB: gdr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gdr -d gdr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Test con il database
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://gdr:gdr@localhost:5432/gdr_test
      - run: npm run build
